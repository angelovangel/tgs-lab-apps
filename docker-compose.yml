name: tgs-lab-apps

# NOTE for deployment on Remote Server:
#
# On the remote server, simply copy this file and run:
#   docker compose pull
#   docker compose up -d

services:
  landing:
    image: python:3.12-alpine
    working_dir: /app
    volumes:
      - ./landing:/app
      - /var/run/docker.sock:/var/run/docker.sock:ro
    environment:
      SERVER_IP: ${SERVER_IP:-}
      REFRESH_SECONDS: ${REFRESH_SECONDS:-5}
      PORT: 8088
    command: >
      sh -c 'apk add --no-cache docker-cli >/dev/null 2>&1 || true; exec python server.py'
    ports:
      - "8088:8088"
    restart: unless-stopped

  rapid-barcoding-ont:
    image: ${DOCKER_USER:-aangeloo}/rapid-barcoding-ont:latest
    build:
      context: ../rapid-barcoding-ont
      dockerfile: Dockerfile
    container_name: shiny_rapid_barcoding
    ports:
      - "3801:3838"
    restart: unless-stopped
    environment:
      - TZ=UTC

  custom-transfer-opentrons:
    image: ${DOCKER_USER:-aangeloo}/custom-transfer-opentrons:latest
    build:
      context: ../custom-transfer-opentrons
      dockerfile: Dockerfile
    container_name: shiny_custom_transfer
    ports:
      - "3802:3838"
    restart: unless-stopped
    environment:
      - TZ=UTC

  kinnex-ot2:
    image: ${DOCKER_USER:-aangeloo}/kinnex-ot2:latest
    build:
      context: ../kinnex-ot2
      dockerfile: Dockerfile
    container_name: shiny_kinnex_ot2
    ports:
      - "3803:3838"
    restart: unless-stopped
    environment:
      - TZ=UTC

  sanger-opentrons:
    image: ${DOCKER_USER:-aangeloo}/sanger-opentrons:latest
    build:
      context: ../sanger-opentrons
      dockerfile: Dockerfile
    container_name: shiny_sanger_opentrons
    ports:
      - "3804:3838"
    restart: unless-stopped
    environment:
      - TZ=UTC

  tracer:
    image: ${DOCKER_USER:-aangeloo}/tracer:latest
    build:
      context: ../tracer
      dockerfile: Dockerfile
    container_name: shiny_tracer
    ports:
      - "3805:3838"
    restart: unless-stopped
    environment:
      - TZ=UTC

  nxf-minimapper:
    image: ${DOCKER_USER:-aangeloo}/minimapper-app:latest
    build:
      context: ../minimapper-app
      dockerfile: Dockerfile
    container_name: shiny_nxf_minimapper
    ports:
      - "3806:3838"
    privileged: true
    devices:
      - /dev/loop-control:/dev/loop-control
    volumes:
      - /dev:/dev:ro
      # Persist Singularity images on host
      - ${HOME}/.singularity_cache:/root/.singularity:rw
    restart: unless-stopped
    environment:
      - TZ=UTC
      - NXF_SINGULARITY_CACHEDIR=/root/.singularity/cache

  zinter:
    image: ${DOCKER_USER:-aangeloo}/zinter:latest
    build:
      context: ../zinter
      dockerfile: Dockerfile
    container_name: shiny_zinter
    ports:
      - "3808:3838"
    restart: unless-stopped
    environment:
      - TZ=UTC

  faster-app:
    image: ${DOCKER_USER:-aangeloo}/faster-app:latest
    build:
      context: ../faster-app
      dockerfile: Dockerfile
    container_name: faster_app
    ports:
      - "3809:8000"
    command: >
      sh -c 'ln -sfn /app/public /app/public/faster-app && exec python -m http.server 8000 --directory /app/public'
    restart: unless-stopped

  ont-run-report:
    image: ${DOCKER_USER:-aangeloo}/ont-run-report:latest
    build:
      context: ../ont-run-report
      dockerfile: Dockerfile
    container_name: shiny_ont_run_report
    ports:
      - "3810:3838"
    restart: unless-stopped
    environment:
      - TZ=UTC
      - SCRIPT_PATH=/usr/local/bin/generate-ont-report.py

  pricing:
    image: python:3.12-alpine
    container_name: pricing_web
    working_dir: /app
    volumes:
      - ../pricing:/app:rw
    environment:
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-/app/secrets/tgs-pricing-1f2045547346.json}
      GOOGLE_SPREADSHEET_ID: ${GOOGLE_SPREADSHEET_ID:-19ByaGb1-X7Z_6_Dwhba1Efn78EQ2Ue9n9uXdAIHCk-U}
      GOOGLE_SHEET_NAME: ${GOOGLE_SHEET_NAME:-Sheet1}
    command: >
      sh -c 'python -m pip install --no-cache-dir -r requirements.txt && python server.py'
    ports:
      - "3811:3811"
    restart: unless-stopped
